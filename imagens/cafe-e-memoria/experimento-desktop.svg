<svg viewBox="0 0 760 302" role="img" aria-labelledby="timeline-title timeline-desc" xmlns="http://www.w3.org/2000/svg">
                  <title id="timeline-title">A sequência do experimento de memória</title><desc id="timeline-desc">Primeiro os participantes observaram imagens. Depois receberam cafeína ou placebo. Vinte e quatro horas depois, fizeram um teste com imagens iguais, semelhantes e novas. Esquema ilustrativo simplificado.</desc>
                  <rect width="760" height="302" rx="7" fill="#e9eee4"/>
                  <text x="28" y="34" fill="#24463b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">O TEMPO IMPORTA</text>
                  <path d="M212 141h73m-10-7 10 7-10 7m205-7h64m-10-7 10 7-10 7" stroke="#7b8d78" stroke-width="1.5" fill="none"/>
                  <g transform="translate(28 65)"><rect width="185" height="136" rx="8" fill="#fffefa"/><rect x="38" y="27" width="43" height="55" rx="4" fill="#e3cfb5" transform="rotate(-9 60 54)"/><rect x="73" y="25" width="43" height="55" rx="4" fill="#ccd9bf" transform="rotate(6 95 52)"/><circle cx="61" cy="51" r="10" fill="#8a5736"/><path d="m95 39 12 22H83z" fill="#55745b"/><text x="92" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#24463b">Observar imagens</text></g>
                  <g transform="translate(286 65)"><rect width="204" height="136" rx="8" fill="#fffefa"/><g transform="translate(69 27) rotate(-26 31 14)"><rect width="63" height="28" rx="14" fill="#e3cfb5"/><path d="M31 0h18a14 14 0 0 1 0 28H31z" fill="#55745b"/><path d="M31 0v28" stroke="#fffefa"/></g><text x="102" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#24463b">Cafeína ou placebo</text><text x="102" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#58665e">após a apresentação</text></g>
                  <g transform="translate(554 65)"><rect width="178" height="136" rx="8" fill="#fffefa"/><circle cx="89" cy="46" r="25" fill="none" stroke="#55745b" stroke-width="2"/><path d="M89 29v18l12 7" fill="none" stroke="#55745b" stroke-width="2" stroke-linecap="round"/><text x="89" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#24463b">Teste de memória</text><text x="89" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#58665e">24 horas depois</text></g>
                  <text x="28" y="238" font-family="Arial,sans-serif" font-size="13" fill="#24463b">O resultado de interesse: distinguir imagens semelhantes.</text><text x="28" y="263" font-family="Arial,sans-serif" font-size="11" fill="#58665e">Esquema simplificado do estudo de Borota e colegas, publicado em 2014.</text>
                </svg>