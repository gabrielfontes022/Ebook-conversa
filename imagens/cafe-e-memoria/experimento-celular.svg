<svg viewBox="0 0 360 422" role="img" aria-labelledby="timeline-mobile-title timeline-mobile-desc" xmlns="http://www.w3.org/2000/svg">
                  <title id="timeline-mobile-title">A sequência do experimento de memória</title><desc id="timeline-mobile-desc">Observar imagens, receber cafeína ou placebo após a apresentação e fazer um teste de memória 24 horas depois. O resultado de interesse foi distinguir imagens semelhantes. Esquema simplificado.</desc>
                  <rect width="360" height="422" rx="7" fill="#e9eee4"/><text x="24" y="35" fill="#24463b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">O TEMPO IMPORTA</text>
                  <g font-family="Arial,sans-serif"><rect x="23" y="56" width="314" height="80" rx="7" fill="#fffefa"/><circle cx="61" cy="96" r="22" fill="#e3cfb5"/><text x="61" y="101" text-anchor="middle" font-size="15" fill="#24463b">1</text><text x="99" y="101" font-size="15" font-weight="700" fill="#24463b">Observar imagens</text>
                  <path d="M61 140v14m-4-4 4 4 4-4" stroke="#7b8d78" fill="none"/><rect x="23" y="160" width="314" height="80" rx="7" fill="#fffefa"/><circle cx="61" cy="200" r="22" fill="#ccd9bf"/><text x="61" y="205" text-anchor="middle" font-size="15" fill="#24463b">2</text><text x="99" y="195" font-size="15" font-weight="700" fill="#24463b">Cafeína ou placebo</text><text x="99" y="217" font-size="12" fill="#58665e">após a apresentação</text>
                  <path d="M61 244v14m-4-4 4 4 4-4" stroke="#7b8d78" fill="none"/><rect x="23" y="264" width="314" height="80" rx="7" fill="#fffefa"/><circle cx="61" cy="304" r="22" fill="#e3cfb5"/><text x="61" y="309" text-anchor="middle" font-size="15" fill="#24463b">3</text><text x="99" y="299" font-size="15" font-weight="700" fill="#24463b">Teste de memória</text><text x="99" y="321" font-size="12" fill="#58665e">24 horas depois</text><text x="24" y="375" font-size="12" fill="#24463b">Resultado de interesse: distinguir</text><text x="24" y="395" font-size="12" fill="#24463b">imagens semelhantes.</text></g>
                </svg>