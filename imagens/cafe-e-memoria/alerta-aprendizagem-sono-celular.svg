<svg viewBox="0 0 360 334" role="img" aria-labelledby="pillars-mobile-title pillars-mobile-desc" xmlns="http://www.w3.org/2000/svg">
                  <title id="pillars-mobile-title">Três processos para entender café e estudo</title><desc id="pillars-mobile-desc">Alerta é estar desperto. Aprendizagem envolve compreender e praticar. O sono participa da consolidação das lembranças. Sentir mais alerta não garante aprender ou lembrar melhor.</desc>
                  <rect width="360" height="334" rx="7" fill="#f2e5d4"/><g font-family="Arial,sans-serif"><text x="24" y="34" font-size="10" font-weight="700" letter-spacing="1.1" fill="#6c4229">UMA XÍCARA, TRÊS PROCESSOS</text>
                  <circle cx="48" cy="80" r="18" fill="#fffefa"/><circle cx="48" cy="80" r="8" fill="none" stroke="#8a5736" stroke-width="1.5"/><text x="83" y="75" font-size="17" font-weight="700" fill="#24463b">Alerta</text><text x="83" y="97" font-size="13" fill="#58665e">Estar desperto</text><path d="M24 121h312" stroke="#cfbfa8"/>
                  <circle cx="48" cy="158" r="18" fill="#fffefa"/><path d="M38 150c5-1 8 0 10 2 2-2 5-3 10-2v15c-5-1-8 0-10 2-2-2-5-3-10-2zm10 2v15" fill="none" stroke="#8a5736" stroke-width="1.5"/><text x="83" y="153" font-size="17" font-weight="700" fill="#24463b">Aprendizagem</text><text x="83" y="175" font-size="13" fill="#58665e">Compreender e praticar</text><path d="M24 199h312" stroke="#cfbfa8"/>
                  <circle cx="48" cy="236" r="18" fill="#fffefa"/><path d="M51 224a12 12 0 1 0 9 18 12 12 0 0 1-9-18Z" fill="none" stroke="#8a5736" stroke-width="1.5"/><text x="83" y="231" font-size="17" font-weight="700" fill="#24463b">Sono</text><text x="83" y="253" font-size="13" fill="#58665e">Consolidar lembranças</text><text x="24" y="298" font-size="12" fill="#6c4229">Sentir mais alerta não garante</text><text x="24" y="318" font-size="12" fill="#6c4229">aprender ou lembrar melhor.</text></g>
